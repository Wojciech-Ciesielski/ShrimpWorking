name: Build ISO

on:
  push:
    branches: [main, "claude/**"]
    paths: ["kiwi/**", "tools/build-iso.sh", ".github/workflows/build-iso.yml"]
  workflow_dispatch:
    inputs:
      leap_version:
        description: "openSUSE Leap version"
        default: "16.1"

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Build live ISO (KIWI)
        run: sudo tools/build-iso.sh "${{ github.event.inputs.leap_version || '16.1' }}"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: shrimp-live-iso
          path: out/*.iso
          compression-level: 0
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-log
          path: out/kiwi.log
          retention-days: 14
