name: Release

# Składa wydanie z jednego commita: buduje ISO (Build ISO) i shrimp-install.exe (Shrimp Install) w tym samym
# przebiegu, liczy SHA-256 i dodaje manifest.json, z którego Shrimp Install pobiera ISO. Tag wskazuje ten sam commit,
# więc w wydaniu nie ma plików z innego stanu kodu.
#  - reuse: zamiast budować od nowa bierze gotowe udane przebiegi, ale tylko zbudowane z TEGO SAMEGO commita.
#  - Repozytorium prywatne: manifest wskazuje zasób przez API GitHub (pobieranie wymaga tokenu, patrz boxes/shrimp-install/README.md).
#  - Repozytorium publiczne: manifest wskazuje zwykły adres pliku wydania, bez tokenu.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag wydania (musi być nowy)"
        required: true
        default: "beta-3.6"
      version:
        description: "Wersja pokazywana w programie i w nazwie pobranego ISO"
        required: true
        default: "Beta 3.6"
      reuse:
        description: "Użyj gotowych przebiegów Build ISO i Shrimp Install z tego samego commita (bez budowania)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  iso:
    if: ${{ !inputs.reuse }}
    uses: ./.github/workflows/build-iso.yml

  exe:
    if: ${{ !inputs.reuse }}
    uses: ./.github/workflows/shrimp-install.yml

  release:
    needs: [iso, exe]
    if: ${{ always() && (inputs.reuse || (needs.iso.result == 'success' && needs.exe.result == 'success')) }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
      MANIFEST_KEY: ${{ secrets.SHRIMP_MANIFEST_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Sprawdź tag i wersję
        run: |
          # Jedno źródło wersji: boxes/branding/root/usr/share/shrimp/version (os-release obrazu i systemu).
          want=$(head -n1 boxes/branding/root/usr/share/shrimp/version)
          if [ "$VERSION" != "$want" ]; then
            echo "::error::Wersja wydania „$VERSION” różni się od wersji w obrazie „$want” (boxes/branding/root/usr/share/shrimp/version)"; exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG już istnieje"; exit 1
          fi

      - name: ISO i program z tego przebiegu
        if: ${{ !inputs.reuse }}
        uses: actions/download-artifact@v8
        with: { name: shrimp-live-iso, path: iso }

      - name: Program z tego przebiegu
        if: ${{ !inputs.reuse }}
        uses: actions/download-artifact@v8
        with: { name: shrimp-install, path: exe }

      - name: Gotowe przebiegi z tego samego commita
        if: ${{ inputs.reuse }}
        run: |
          pick() { gh run list -R "$REPO" -w "$1" -c "$GITHUB_SHA" -s success -L 1 --json databaseId -q '.[0].databaseId'; }
          ISO_RUN=$(pick build-iso.yml); EXE_RUN=$(pick shrimp-install.yml)
          if [ -z "$ISO_RUN" ] || [ -z "$EXE_RUN" ]; then
            echo "::error::Brak udanego przebiegu Build ISO ($ISO_RUN) albo Shrimp Install ($EXE_RUN) dla commita $GITHUB_SHA. Uruchom wydanie bez „reuse”, żeby je zbudować."; exit 1
          fi
          echo "Build ISO: $ISO_RUN, Shrimp Install: $EXE_RUN (commit $GITHUB_SHA)"
          gh run download "$ISO_RUN" -R "$REPO" -n shrimp-live-iso -D iso
          gh run download "$EXE_RUN" -R "$REPO" -n shrimp-install -D exe

      - name: Sprawdź pliki
        run: |
          ls -l iso exe
          test -f exe/shrimp-install.exe
          [ "$(ls iso/*.iso | wc -l)" = 1 ] || { echo "::error::oczekiwano jednego pliku ISO"; exit 1; }

      - name: Manifest i sumy kontrolne
        run: |
          iso=$(ls iso/*.iso | head -n1)
          name=$(basename "$iso")
          size=$(stat -c %s "$iso")
          sha=$(sha256sum "$iso" | cut -d' ' -f1)
          echo "ISO_NAME=$name" >> "$GITHUB_ENV"
          echo "ISO_SIZE=$size" >> "$GITHUB_ENV"
          echo "ISO_SHA=$sha" >> "$GITHUB_ENV"
          mkdir -p assets
          cp "$iso" "assets/$name"
          cp exe/shrimp-install.exe assets/shrimp-install.exe
          # what the ISO was built from (commit, base image, versions fetched during the build)
          [ -f iso/build-info.txt ] && cp iso/build-info.txt assets/build-info.txt
          (cd assets && sha256sum "$name" shrimp-install.exe > SHA256SUMS)
          # Plik ISO powyżej 2 GiB nie zmieści się w zasobie wydania GitHub.
          if [ "$size" -ge $((2*1024*1024*1024)) ]; then
            echo "::error::ISO ma $size B, a zasób wydania może mieć najwyżej 2 GiB: trzeba podzielić obraz"; exit 1
          fi

      - name: Utwórz wydanie
        run: |
          private=$(gh api "repos/$REPO" --jq .private)
          cat > notes.md <<NOTES
          Shrimp $VERSION: wydanie testowe.

          - \`shrimp-install.exe\`: program dla Windows. Pobiera ISO z tego wydania, sprawdza sumę SHA-256, przygotowuje nośnik i zapisuje dane z Windows.
          - \`$ISO_NAME\`: obraz Shrimp (SHA-256: \`$ISO_SHA\`).
          - \`manifest.json\`: opis pobierania, który czyta program.

          Program nie jest podpisany (Authenticode), więc SmartScreen ostrzeże przed uruchomieniem.
          Nie testowano na prawdziwym sprzęcie: zapis nośnika i start z UEFI sprawdza dopiero komputer.
          NOTES
          # what the image build skipped (NVIDIA, codecs, icons, extensions): never silently
          if [ -s iso/build-warnings.txt ]; then
            { echo; echo "Ostrzeżenia z budowy obrazu (tych elementów może brakować):"; echo
              sed 's/^/- /' iso/build-warnings.txt; } >> notes.md
          fi
          if [ "$private" = true ]; then
            cat >> notes.md <<'NOTES'

          Repozytorium jest prywatne: przed uruchomieniem programu ustaw token GitHub z odczytem tego repozytorium
          (`$env:SHRIMP_TOKEN = "…"` w PowerShell albo pierwszy wiersz pliku `%LOCALAPPDATA%\Shrimp Install\token.txt`).
          NOTES
          fi
          gh release create "$TAG" assets/* --repo "$REPO" --target "$GITHUB_SHA" --title "Shrimp $VERSION" --notes-file notes.md
          echo "PRIVATE=$private" >> "$GITHUB_ENV"

      - name: Dodaj manifest
        run: |
          if [ "$PRIVATE" = true ]; then
            id=$(gh api "repos/$REPO/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$ISO_NAME\") | .id")
            url="https://api.github.com/repos/$REPO/releases/assets/$id"
          else
            url="https://github.com/$REPO/releases/download/$TAG/$ISO_NAME"
          fi
          jq -n --arg v "$VERSION" --arg u "$url" --argjson s "$ISO_SIZE" --arg h "$ISO_SHA" \
            '{version:$v, url:$u, size:$s, sha256:$h}' > manifest.json
          cat manifest.json
          files=(manifest.json)
          if [ -n "$MANIFEST_KEY" ]; then
            printf '%s' "$MANIFEST_KEY" > key.pem
            openssl dgst -sha256 -sign key.pem -out manifest.json.sig manifest.json
            rm -f key.pem
            files+=(manifest.json.sig)
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$REPO"
          echo "### Wydanie $TAG" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --repo "$REPO" --json url -q .url >> "$GITHUB_STEP_SUMMARY"
