name: Setup

on:
  push:
    paths: ["setup/**", "i18n/**", "standardize/**", "shrimp-install/schema/**", ".github/workflows/setup.yml"]
  pull_request:
    paths: ["setup/**", "i18n/**", "standardize/**", "shrimp-install/schema/**", ".github/workflows/setup.yml"]
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: setup/web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: setup/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Identyfikatory Flathub z katalogu programów
        run: node scripts/check-flathub.mjs
      - run: npm run build
      - name: Zrzuty wszystkich stanów (1920×1080 i 1366×768)
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p screens/1920 screens/1366
          node scripts/screens.mjs screens/1920 1920 1080
          node scripts/screens.mjs screens/1366 1366 768
      - uses: actions/upload-artifact@v4
        with: { name: setup-screens, path: setup/web/screens }

  shell:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: setup/shell } }
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - run: cargo test --locked
      - run: cargo build --locked --release

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S warning setup/install.sh setup/system/share/post-install.sh setup/system/libexec/shrimp-setup-apply setup/system/libexec/shrimp-usb-backup setup/tests/test-usb-backup.sh standardize/shrimp-app-style
      - run: setup/tests/test-apply.sh
      - run: setup/tests/test-usb-backup.sh
      - run: python3 -c "import yaml; yaml.safe_load(open('setup/system/agama/shrimp.yaml'))"
