name: Test ISO

# Boots the newest successful "Build ISO" artifact in QEMU/KVM and saves
# screenshots of GRUB, Plymouth, the desktop, the lock screen and GDM to
# <branch>/iso/ on the wyniki-testow branch (tools/ci-wyniki.sh).

on:
  push:
    branches: [main, "claude/**"]
    paths: ["tools/qemu-test.py", "tools/inspect-iso.sh", ".github/workflows/test-iso.yml"]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build ISO run id (empty = newest successful)"
        default: ""
      grub_lang:
        description: "GRUB menu language tag to test, e.g. ja, ar, de (empty = English, as without Shrimp Install)"
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [uefi, secureboot, bios]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Download ISO
        run: |
          id="${{ github.event.inputs.build_run_id }}"
          # newest successful build of this branch, otherwise of any branch
          [ -n "$id" ] || id=$(gh run list -R "$GITHUB_REPOSITORY" -w build-iso.yml -s success -b "$GITHUB_REF_NAME" -L 1 --json databaseId -q '.[0].databaseId')
          [ -n "$id" ] || id=$(gh run list -R "$GITHUB_REPOSITORY" -w build-iso.yml -s success -L 1 --json databaseId -q '.[0].databaseId')
          echo "Build ISO run: $id"
          echo "$id" > build-run-id.txt
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n shrimp-live-iso -D iso
          ls -l iso

      - name: Set GRUB language (${{ github.event.inputs.grub_lang }})
        if: github.event.inputs.grub_lang != ''
        env:
          GRUB_LANG: ${{ github.event.inputs.grub_lang }}
        run: |
          # what Shrimp Install writes next to the ISO files on the stick (boot/grub2/shrimp-lang.cfg)
          sudo apt-get install -yq --no-install-recommends xorriso
          printf 'set shrimp_lang=%s\n' "$GRUB_LANG" > shrimp-lang.cfg
          src=$(ls iso/*.iso | head -n1)
          xorriso -indev "$src" -outdev iso/with-lang.iso -boot_image any replay -map shrimp-lang.cfg /boot/grub2/shrimp-lang.cfg
          mv iso/with-lang.iso "$src"
          ls -l iso

      - name: Enable KVM and install QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 ovmf imagemagick libglib2.0-bin squashfs-tools
          ls -l /dev/kvm /usr/share/OVMF/

      - name: Inspect ISO contents
        if: matrix.mode == 'uefi'
        continue-on-error: true
        run: |
          mkdir -p out/uefi
          sudo tools/inspect-iso.sh iso/*.iso 2>&1 | tee out/uefi/inspect.txt

      - name: Boot and capture (${{ matrix.mode }})
        run: python3 tools/qemu-test.py iso/*.iso out/${{ matrix.mode }} ${{ matrix.mode }}

      - name: Convert screenshots
        if: always()
        run: |
          cd out/${{ matrix.mode }} || exit 0
          mkdir -p jpg
          for f in *.png; do [ -e "$f" ] && convert "$f" -quality 85 "jpg/${f%.png}.jpg"; done
          cp ../../build-run-id.txt . || true
          ls -l jpg | tail -n +1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-test-${{ matrix.mode }}
          path: out/${{ matrix.mode }}
          retention-days: 14

  publish:
    needs: boot
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          pattern: iso-test-*
          path: dl

      - name: Save screenshots
        run: |
          rm -rf test-results/iso
          for d in dl/iso-test-*; do
            m=${d#dl/iso-test-}
            mkdir -p test-results/iso/$m
            cp "$d"/jpg/*.jpg test-results/iso/$m/ 2>/dev/null || true
            cp "$d"/serial.log "$d"/inspect.txt "$d"/shots.json "$d"/build-run-id.txt test-results/iso/$m/ 2>/dev/null || true
          done
          tools/ci-wyniki.sh iso test-results/iso
