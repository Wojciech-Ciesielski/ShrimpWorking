name: Test ISO

# Boots the newest successful "Build ISO" artifact in QEMU/KVM and commits
# screenshots of GRUB, Plymouth, the desktop, the lock screen and GDM to
# test-results/iso/ on the same branch.

on:
  push:
    branches: [main, "claude/**"]
    paths: ["tools/qemu-test.py", ".github/workflows/test-iso.yml"]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Build ISO run id (empty = newest successful)"
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [uefi, secureboot, bios]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download ISO
        run: |
          id="${{ github.event.inputs.build_run_id }}"
          [ -n "$id" ] || id=$(gh run list -R "$GITHUB_REPOSITORY" -w build-iso.yml -s success -L 1 --json databaseId -q '.[0].databaseId')
          echo "Build ISO run: $id"
          echo "$id" > build-run-id.txt
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n shrimp-live-iso -D iso
          ls -l iso

      - name: Enable KVM and install QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 ovmf imagemagick
          ls -l /dev/kvm /usr/share/OVMF/

      - name: Boot and capture (${{ matrix.mode }})
        run: python3 tools/qemu-test.py iso/*.iso out/${{ matrix.mode }} ${{ matrix.mode }}

      - name: Convert screenshots
        if: always()
        run: |
          cd out/${{ matrix.mode }} || exit 0
          mkdir -p jpg
          for f in *.png; do [ -e "$f" ] && convert "$f" -quality 85 "jpg/${f%.png}.jpg"; done
          cp ../../build-run-id.txt . || true
          ls -l jpg | tail -n +1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-test-${{ matrix.mode }}
          path: out/${{ matrix.mode }}
          retention-days: 14

  publish:
    needs: boot
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          pattern: iso-test-*
          path: dl

      - name: Commit screenshots
        run: |
          rm -rf test-results/iso
          for d in dl/iso-test-*; do
            m=${d#dl/iso-test-}
            mkdir -p test-results/iso/$m
            cp "$d"/jpg/*.jpg test-results/iso/$m/ 2>/dev/null || true
            cp "$d"/serial.log "$d"/shots.json "$d"/build-run-id.txt test-results/iso/$m/ 2>/dev/null || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/iso
          git commit -m "ISO test screenshots (run ${{ github.run_id }}) [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && break; sleep 5; done
