name: Fonts probe

# Checks which Leap font packages cover the scripts of all GNOME languages (Setup, onboarding,
# apps), so kiwi/config.kiwi lists only names that exist. Result: test-results/fonts/ on the same branch.

on:
  push:
    branches: [main, "claude/**"]
    paths: ["tools/fonts-probe.sh", ".github/workflows/fonts-probe.yml"]
  workflow_dispatch:
    inputs:
      leap_version:
        description: "openSUSE Leap version"
        default: "16.1"

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Probe font packages
        run: |
          mkdir -p test-results/fonts
          sudo docker run --rm -v "$PWD:/work" -w /work docker.io/opensuse/tumbleweed:latest \
            bash tools/fonts-probe.sh "${{ github.event.inputs.leap_version || '16.1' }}" test-results/fonts
          sudo chown -R "$(id -u):$(id -g)" test-results/fonts
          cat test-results/fonts/summary.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/fonts
          git commit -m "Fonts probe (run ${{ github.run_id }}) [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && break; sleep 5; done
