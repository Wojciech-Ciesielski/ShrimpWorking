name: Panko

on:
  push:
    paths: ["apps/panko/**", "apps/shrimp-i18n/**", "i18n/panko/**", "i18n/langs.ts", "site/help.json", ".github/workflows/panko.yml"]
  pull_request:
    paths: ["apps/panko/**", "apps/shrimp-i18n/**", "i18n/panko/**", "i18n/langs.ts", "site/help.json", ".github/workflows/panko.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Testy po polsku (LANGUAGE czyta i18n Shrimp i Web Apps)
    env: { LANGUAGE: pl }
    defaults: { run: { working-directory: apps/panko } }
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev desktop-file-utils libxml2-utils
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: desktop-file-validate data/org.shrimp.Panko.desktop
      - run: xmllint --noout data/org.shrimp.Panko.policy
