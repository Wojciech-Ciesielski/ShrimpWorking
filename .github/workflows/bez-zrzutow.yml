name: Bez zrzutów

# Zasada właściciela: żaden PR nie dodaje zrzutów ekranu ani wyników testów (test-results/).
# Zrzuty z CI trafiają tylko na gałąź wyniki-testow (tools/ci-wyniki.sh).
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: tools/bez-zrzutow.sh "origin/${{ github.base_ref }}"
