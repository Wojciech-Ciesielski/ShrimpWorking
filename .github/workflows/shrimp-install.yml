name: Shrimp Install

on:
  push:
    paths: ["boxes/shrimp-install/**", "boxes/i18n-core/**", "boxes/help-links/**", "boxes/install-schema/**", ".github/workflows/shrimp-install.yml"]
  pull_request:
    paths: ["boxes/shrimp-install/**", "boxes/i18n-core/**", "boxes/help-links/**", "boxes/install-schema/**", ".github/workflows/shrimp-install.yml"]
  workflow_call:
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: boxes/shrimp-install/ui } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: boxes/shrimp-install/ui/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Komunikaty natywne (native_i18n.h) zgodne z boxes/shrimp-install/i18n
        run: node ../tools/gen-native-i18n.mjs --check
      - name: Test odczytu adresów z odpowiedzi API GitHub
        working-directory: boxes/shrimp-install
        run: gcc -Wall -Wextra -Werror -o /tmp/relurl_test tests/relurl_test.c && /tmp/relurl_test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with: { name: install-ui, path: boxes/shrimp-install/ui/dist/index.html }

  windows:
    needs: ui
    runs-on: windows-latest
    defaults: { run: { shell: "msys2 {0}" } }
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            base-devel
            autotools
            unzip
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: install-ui, path: ui-dist }
      - name: WebView2 SDK, adres manifestu i interfejs
        env:
          SHRIMP_REPO: ${{ github.repository }}
          SHRIMP_PRIVATE: ${{ github.event.repository.private }}
        run: |
          SKIP_UI=1 boxes/shrimp-install/tools/prepare.sh
          cp ui-dist/index.html boxes/shrimp-install/rufus/src/shrimp/ui.html
      - name: Kompilacja (fork Rufusa)
        working-directory: boxes/shrimp-install/rufus
        run: |
          ./bootstrap.sh
          ./configure --disable-debug
          make -j4
          mkdir -p ../../../out
          cp src/rufus.exe ../../../out/shrimp-install.exe
          strip ../../../out/shrimp-install.exe
          sha256sum ../../../out/shrimp-install.exe
      - name: Dane z Windows (--collect)
        shell: pwsh
        run: |
          $p = Start-Process out\shrimp-install.exe -ArgumentList '--collect', "$PWD\out\collect.json" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "kod wyjścia $($p.ExitCode)" }
          $j = Get-Content out\collect.json -Raw -Encoding utf8 | ConvertFrom-Json
          if (-not $j.user.name) { throw 'brak user.name' }
          if (-not $j.locale.timezone) { throw 'brak locale.timezone' }
          if ($j.apps.Count -lt 1) { throw 'pusta lista programów' }
          if ($j.folders.Count -ne 6) { throw 'brak folderów' }
          "użytkownik: $($j.user.name), strefa: $($j.locale.timezone), programów: $($j.apps.Count), klawiatury: $($j.locale.keyboards -join ',')"
      - name: Kontrakt shrimp.json (boxes/install-schema) dla wyniku --collect i przykładu
        shell: pwsh
        run: |
          $schema = "boxes/install-schema/shrimp.schema.json"
          foreach ($f in 'out\collect.json', 'boxes\install-schema\shrimp.example.json') {
            $ok = Get-Content $f -Raw -Encoding utf8 | Test-Json -SchemaFile $schema -ErrorAction SilentlyContinue -ErrorVariable bad
            if (-not $ok) { $bad | ForEach-Object { $_.ToString() }; throw "$f nie zgadza się ze schematem" }
            "${f}: zgodny ze schematem"
          }
      - name: Kopia zawartości nośnika (--backup-test)
        shell: pwsh
        run: |
          $src = "$env:RUNNER_TEMP\usb-src"; $dst = "$env:RUNNER_TEMP\usb-dst"; $work = "$env:RUNNER_TEMP\usb-work"
          New-Item -ItemType Directory -Force "$src\DCIM\100", "$src\Pusty folder", "$src\Zażółć", $work | Out-Null
          Set-Content "$src\notatka.txt" "pendrive użytkownika" -Encoding utf8
          [IO.File]::WriteAllBytes("$src\DCIM\100\a.bin", [byte[]](1..255 * 4000))
          New-Item -ItemType File "$src\Zażółć\pusty.dat" | Out-Null
          $f = [IO.File]::Create("$src\duzy.iso"); $f.SetLength(4.5GB); $f.Close()
          $p = Start-Process out\shrimp-install.exe -ArgumentList '--backup-test', $src, $dst, $work -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "kod wyjścia $($p.ExitCode)" }
          if (-not (Test-Path "$dst\shrimp-backup\manifest.tsv")) { throw 'brak manifest.tsv' }
          if (-not (Test-Path "$dst\shrimp-backup\files\duzy.iso.shrimp-part002")) { throw 'plik > 4 GB nie został podzielony' }
          if (-not (Test-Path "$dst\shrimp-backup\files\Pusty folder")) { throw 'brak pustego folderu' }
          Get-Content "$dst\shrimp-backup\manifest.tsv"
      - name: Miejsce obok Windows (--shrink-test, zmniejszenie partycji NTFS)
        # Wirtualny dysk 60 GB z jedną partycją NTFS (jak C:), na niej 6 GB danych. Program zmniejsza ją
        # narzędziami Windows (Resize-Partition) tak, żeby zostało 20 GiB wolnego miejsca, a prośba o więcej,
        # niż Windows odda, kończy się czytelnym błędem bez zmian na dysku.
        shell: pwsh
        timeout-minutes: 15
        run: |
          $tmp = $env:RUNNER_TEMP
          $vhd = "$tmp\windows.vhdx"
          "create vdisk file=`"$vhd`" maximum=60000 type=expandable`nselect vdisk file=`"$vhd`"`nattach vdisk`nconvert gpt`ncreate partition primary`nformat fs=ntfs quick label=TESTWIN`nassign letter=W" | Set-Content "$tmp\dp-win.txt" -Encoding ascii
          diskpart /s "$tmp\dp-win.txt" | Out-Host
          $f = [IO.File]::Create("W:\dane.bin"); $f.SetLength(6GB); $f.Close()
          $before = Get-Partition -DriveLetter W
          "partycja przed: $($before.Size) B"
          $log = "$env:LOCALAPPDATA\Shrimp Install\shrimp-install.log"
          $want = 20GB
          $p = Start-Process out\shrimp-install.exe -ArgumentList '--shrink-test', 'W', $want -PassThru -Wait
          Get-Content $log -ErrorAction SilentlyContinue | Select-String 'Shrimp: (dysk|zmniejsz|na dysku|C: |W: )' | Select-Object -Last 20 | Out-Host
          if ($p.ExitCode -ne 0) { throw "kod wyjścia $($p.ExitCode)" }
          $after = Get-Partition -DriveLetter W
          $free = (Get-Disk -Number $after.DiskNumber).LargestFreeExtent
          "partycja po: $($after.Size) B, wolne: $free B"
          if ($free -lt $want) { throw "za mało wolnego miejsca: $free B" }
          if (-not (Test-Path W:\dane.bin)) { throw 'dane zniknęły po zmniejszeniu' }
          # Za dużo: Windows nie zmniejszy partycji poniżej zajętego miejsca, program kończy kodem 3 i nic nie zmienia.
          $p = Start-Process out\shrimp-install.exe -ArgumentList '--shrink-test', 'W', 58GB -PassThru -Wait
          if ($p.ExitCode -ne 3) { throw "oczekiwany kod 3 (za dużo), jest $($p.ExitCode)" }
          if ((Get-Partition -DriveLetter W).Size -ne $after.Size) { throw 'partycja zmieniła się mimo błędu' }
          "za duża prośba odrzucona bez zmian"
          Copy-Item $log out\shrink-test.log -ErrorAction SilentlyContinue
          "select vdisk file=`"$vhd`"`ndetach vdisk" | Set-Content "$tmp\dp-win2.txt" -Encoding ascii
          diskpart /s "$tmp\dp-win2.txt" | Out-Host
      - name: Pełny zapis na pusty wirtualny nośnik 32 GB (--auto-disk)
        # Jak u użytkownika: całkowicie pusty dysk (bez tablicy partycji), ISO z ostatniego wydania,
        # potem sprawdzenie, co jest na nośniku. Dziennik programu trafia do artefaktu.
        shell: pwsh
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tmp = $env:RUNNER_TEMP
          gh release download --repo $env:GITHUB_REPOSITORY --pattern '*.iso' --dir "$tmp\iso"
          $iso = (Get-ChildItem "$tmp\iso\*.iso" | Select-Object -First 1).FullName
          "obraz: $iso ($((Get-Item $iso).Length) B)"
          $vhd = "$tmp\nosnik.vhdx"
          "create vdisk file=`"$vhd`" maximum=30000 type=expandable`nselect vdisk file=`"$vhd`"`nattach vdisk" | Set-Content "$tmp\dp.txt" -Encoding ascii
          diskpart /s "$tmp\dp.txt" | Out-Host
          $disk = Get-DiskImage -ImagePath $vhd | Get-Disk
          "dysk testowy: numer $($disk.Number), $($disk.Size) B, styl $($disk.PartitionStyle)"
          $p = Start-Process out\shrimp-install.exe -ArgumentList '--source', $iso, '--auto-disk', $disk.Number -PassThru
          $log = "$env:LOCALAPPDATA\Shrimp Install\shrimp-install.log"
          $ok = $p.WaitForExit(25 * 60 * 1000)
          Copy-Item $log out\auto-disk.log -ErrorAction SilentlyContinue
          Get-Content $log -ErrorAction SilentlyContinue | Select-String -NotMatch '^\S+ \+' | Select-Object -Last 120 | Out-Host
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw 'program nie skończył zapisu w 25 minut (zawieszenie)' }
          if ($p.ExitCode -ne 0) { throw "kod wyjścia $($p.ExitCode)" }
          $vol = Get-Partition -DiskNumber $disk.Number | Get-Volume | Where-Object { $_.FileSystemLabel -eq 'SHRIMP_LIVE' }
          if (-not $vol) { throw 'brak woluminu SHRIMP_LIVE' }
          "wolumin: $($vol.FileSystem), $($vol.Size) B"
          if ($vol.FileSystem -ne 'FAT32') { throw "system plików $($vol.FileSystem) zamiast FAT32" }
          $root = if ($vol.DriveLetter) { "$($vol.DriveLetter):\" } else { $vol.Path }
          foreach ($f in 'EFI\BOOT\bootx64.efi', 'LiveOS\squashfs.img', 'boot\x86_64\loader\initrd', 'shrimp-transfer\shrimp.json') {
            if (-not (Test-Path -LiteralPath (Join-Path $root $f))) { throw "brak $f na nośniku" }
          }
          "nośnik gotowy: $((Get-Item -LiteralPath (Join-Path $root 'LiveOS\squashfs.img')).Length) B squashfs, shrimp.json:"
          Get-Content -LiteralPath (Join-Path $root 'shrimp-transfer\shrimp.json') -Raw | Out-Host
      - name: "Okno z WebView2 (tryb --demo), program uruchamia się na każdym ekranie"
        shell: pwsh
        run: |
          foreach ($t in 'light', 'dark') {
            foreach ($s in 'start', 'nosnik', 'pliki', 'miejsce', 'postep') {
              $p = Start-Process out\shrimp-install.exe -ArgumentList '--demo', '--screen', $s, '--theme', $t -PassThru
              Start-Sleep -Seconds 8
              $p.Refresh()
              if ($p.HasExited) { throw "program zakończył się (kod $($p.ExitCode)) na ekranie $s" }
              "${t}/${s}: okno '$($p.MainWindowTitle)'"
              Stop-Process -Id $p.Id -Force
              Start-Sleep -Seconds 2
            }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: shrimp-install, path: out }
