[package]
name = "shrimp-setup"
version = "0.1.0"
edition = "2021"
description = "Okno Setup Shrimp: instalacja nad Agamą i pierwsza konfiguracja"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
webkit6 = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "fs", "sync", "time"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"

[profile.release]
lto = true
strip = true
