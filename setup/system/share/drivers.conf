# Pakiety dla kroku „Obraz i dźwięk bez problemów” (czyta shrimp-setup-apply).
# Dźwięk i wideo idą przez PipeWire, który jest w systemie od instalacji. Bez Packmana:
# tylko pakiety z repozytoriów Leap i openh264 od Cisco (repozytorium z openSUSE-repos-Leap).
CODEC_PACKAGES="pipewire-pulseaudio pipewire-alsa gstreamer-plugin-pipewire gstreamer-1.20-plugin-openh264 mozilla-openh264"

# Oficjalny sterownik NVIDIA (repozytorium NVIDIA dla openSUSE, download.nvidia.com/opensuse/leap/).
# Repozytorium dodaje pakiet openSUSE-repos-Leap-NVIDIA; gdy go nie ma, dodajemy adres wprost.
NVIDIA_REPO_PACKAGE="openSUSE-repos-Leap-NVIDIA"
NVIDIA_REPO_URL="https://download.nvidia.com/opensuse/leap/\$releasever"
NVIDIA_REPO_ALIAS="NVIDIA"

# Karty od Turinga (GTX 16xx, RTX 20xx i nowsze): otwarte moduły jądra podpisane przez SUSE,
# więc działają z Secure Boot bez MOK. Pierwsza seria dostępna w repozytorium wygrywa.
NVIDIA_OPEN_SERIES="G07 G06"
NVIDIA_OPEN_PACKAGES="nvidia-open-driver-@S@-signed-kmp-meta nvidia-video-@S@ nvidia-gl-@S@ nvidia-compute-utils-@S@"
# Starsze karty (Maxwell, Pascal, Volta): zamknięty moduł G06. Bez podpisu SUSE, więc przy
# włączonym Secure Boot zostaje otwarty sterownik z Mesa (nouveau/NVK), żeby obraz nie zniknął.
NVIDIA_LEGACY_PACKAGES="nvidia-driver-G06-kmp-default nvidia-video-G06 nvidia-gl-G06 nvidia-compute-utils-G06"
# Pierwszy identyfikator urządzenia PCI rodziny Turing; niższe to starsze generacje.
NVIDIA_TURING_MIN_ID=0x1e00
