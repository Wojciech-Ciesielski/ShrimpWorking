# Nośnik Shrimp: Agama serwuje interfejs Setup Shrimp i słucha tylko lokalnie.
# Jeden adres: Agama 24 bierze z --address tylko pierwszy wpis listy (test QEMU: słuchała
# wyłącznie na ::1, a okno łączy się z 127.0.0.1 → „Connection refused”).
[Service]
ExecStart=
ExecStart=/usr/bin/agama-web-server serve --address 127.0.0.1:80 --web-ui-dir /usr/share/shrimp-setup/ui
