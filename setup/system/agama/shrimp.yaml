# Produkt Shrimp dla Agamy (Leap 16.1 / Agama 24). Instaluj do /usr/share/agama/products.d/.
# Na podstawie products.d/leap_161.yaml z agama-project/agama (gałąź SLE-16.1-QU), tryb „immutable”.
# Różnice: tylko GNOME, jeden wolumin Btrfs na cały przydział Shrimp (/var jako podwolumin,
# więc /home i aplikacje nie są ograniczone do 25 GiB), bez wyboru wzorców i systemu plików.
id: Shrimp
name: Shrimp
description: Shrimp na openSUSE Leap 16.1 z GNOME.
icon: Shrimp.svg
licenses:
  - license.opensuse
software:
  installation_repositories:
    - url: https://download.opensuse.org/distribution/leap/16.1/repo/oss/$basearch
  installation_labels:
    - label: Leap-DVD-x86_64
      archs: x86_64
  mandatory_patterns:
    - immutable_base
    - gnome
  optional_patterns: []
  user_patterns: []
  mandatory_packages:
    - Leap_immutable-release
    - NetworkManager
    - openSUSE-repos-Leap
    - sudo-policy-wheel-auth-self
    - flatpak
    - gdm
    # okno Setup (shrimp-setup: GTK4 + WebKitGTK 6) w pierwszej konfiguracji
    - libwebkitgtk-6_0-4
    # przywracanie pendrive'a z Shrimp Install (shrimp-usb-backup): partycjonowanie i systemy plików
    - parted
    - dosfstools
    - exfatprogs
    - ntfsprogs
    # Steam z Flathub (com.valvesoftware.Steam): reguły udev dla kontrolerów i GameMode
    # (te same pakiety są w kiwi/config.kiwi dla sesji live)
    - steam-devices
    - gamemode
    # Pakiet Shrimp z tym Setup, motywami i skryptem wyglądu (repozytorium Shrimp: do ustalenia
    # razem z budową ISO; dopóki go nie ma, ISO wgrywa pliki do obrazu docelowego w post-install.sh).
    # - shrimp-setup
  optional_packages:
    - os-prober
  base_product: Leap
modes:
  - id: immutable
    name: Shrimp
    description: System niezmienny z migawkami
    software:
      mandatory_patterns:
        - immutable_base
        - gnome
    storage:
      space_policy: keep
      volumes:
        - /
      volume_templates:
        - mount_path: /
          filesystem: btrfs
          btrfs:
            snapshots: true
            read_only: true
            default_subvolume: '@'
            subvolumes:
              - path: home
              - path: opt
              - path: root
              - path: srv
              - path: usr/local
              - path: boot/writable
              - path: var
                copy_on_write: false
              - path: boot/grub2/x86_64-efi
                archs: x86_64
          size:
            auto: false
            min: 20 GiB
          outline:
            required: true
            snapshots_configurable: false
            filesystems:
              - btrfs
