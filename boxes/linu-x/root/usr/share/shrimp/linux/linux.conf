# Linu(x): standard Shrimp ponad zwykłego Linuksa. Nazwa jest tylko wewnętrzna (logi, kod, strona
# projektu): użytkownik nie widzi jej w systemie. Pełna nazwa i hasło są tylko na stronie.
#   1. oficjalny sterownik NVIDIA (build/20-nvidia.sh, /usr/libexec/shrimp-gpu-gate),
#   2. dźwięk i wideo przez PipeWire z kodekami (build/10-codecs.sh),
#   3. aplikacje Qt i Electron w wyglądzie libadwaita (build/30-app-style.sh, /usr/bin/shrimp-app-style).
# Skrypty z build/ uruchamia fragment config.sh boxa linu-x (boxes/linu-x/configure.sh) podczas budowy obrazu, potem są usuwane.

# Kodeki: tylko PipeWire i repozytoria Leap + openh264 od Cisco, bez Packmana (decyzja 2026-11-05).
# Rdzeń PipeWire (pipewire, wireplumber, pipewire-pulseaudio, pipewire-alsa) jest w config.kiwi.
CODEC_PACKAGES="gstreamer-plugin-pipewire gstreamer-plugins-base gstreamer-plugins-good gstreamer-plugins-bad gstreamer-plugins-libav"
OPENH264_REPO_URL="http://codecs.opensuse.org/openh264/openSUSE_Leap_16/"
OPENH264_PACKAGES="mozilla-openh264 gstreamer-1.20-plugin-openh264"

# NVIDIA: te same serie i pakiety co setup/system/share/drivers.conf (Setup po instalacji).
# Na nośniku tylko otwarte moduły podpisane przez SUSE (Turing i nowsze), bo działają z Secure Boot.
# Starsze karty zostają przy nouveau (shrimp-gpu-gate); zamknięty G06 doinstalowuje Setup.
NVIDIA_REPO_BASE="https://download.nvidia.com/opensuse/leap"
NVIDIA_OPEN_SERIES="G07 G06"
NVIDIA_OPEN_PACKAGES="nvidia-open-driver-@S@-signed-kmp-meta nvidia-video-@S@ nvidia-gl-@S@ nvidia-compute-utils-@S@"
NVIDIA_TURING_MIN_ID=0x1e00
