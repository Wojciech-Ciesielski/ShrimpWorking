# Linu(x): standard Shrimp ponad zwykłego Linuksa. Nazwa jest tylko wewnętrzna (logi, kod): użytkownik
# nie widzi jej w systemie. Pełna nazwa i hasło są tylko na stronie projektu.
#   1. oficjalny sterownik NVIDIA (build/20-nvidia.sh, /usr/libexec/shrimp-gpu-gate),
#   2. dźwięk i wideo przez PipeWire z kodekami (build/10-codecs.sh),
#   3. aplikacje Qt, Electron i GTK3 w wyglądzie libadwaita (box app-style, /usr/bin/shrimp-app-style).
#
# Jedno źródło pakietów dla nośnika i zainstalowanego systemu:
#   - budowa obrazu: build/*.sh (uruchamia je boxes/linu-x/configure.sh, potem build/ jest usuwany),
#   - pierwsza konfiguracja: shrimp-setup-apply (krok „Obraz i dźwięk”, box setup).

# Kodeki: tylko PipeWire i repozytoria Leap + openh264 od Cisco, bez Packmana (decyzja 2026-11-05).
# Rdzeń PipeWire (pipewire, wireplumber, pipewire-pulseaudio, pipewire-alsa) to pakiety boxa linu-x.
CODEC_PACKAGES="gstreamer-plugin-pipewire gstreamer-plugins-base gstreamer-plugins-good gstreamer-plugins-bad gstreamer-plugins-libav"
# openh264: osobne repozytorium, bo binaria muszą pochodzić od Cisco.
OPENH264_REPO_URL="http://codecs.opensuse.org/openh264/openSUSE_Leap_16/"
OPENH264_REPO_ALIAS="openh264"
OPENH264_PACKAGES="mozilla-openh264 gstreamer-1.20-plugin-openh264"

# Oficjalny sterownik NVIDIA (repozytorium NVIDIA dla openSUSE). Setup dodaje je pakietem
# openSUSE-repos-Leap-NVIDIA, a gdy go nie ma, adresem wprost (z $releasever, żeby szło za aktualizacją Leap).
NVIDIA_REPO_BASE="https://download.nvidia.com/opensuse/leap"
NVIDIA_REPO_URL="$NVIDIA_REPO_BASE/\$releasever"
NVIDIA_REPO_ALIAS="NVIDIA"
NVIDIA_REPO_PACKAGE="openSUSE-repos-Leap-NVIDIA"

# Karty od Turinga (GTX 16xx, RTX 20xx i nowsze): otwarte moduły jądra podpisane przez SUSE,
# więc działają z Secure Boot bez MOK. Pierwsza seria dostępna w repozytorium wygrywa.
# Nośnik ma tylko je; starsze karty zostają tam przy nouveau (shrimp-gpu-gate).
NVIDIA_OPEN_SERIES="G07 G06"
NVIDIA_OPEN_PACKAGES="nvidia-open-driver-@S@-signed-kmp-meta nvidia-video-@S@ nvidia-gl-@S@ nvidia-compute-utils-@S@"
# Starsze karty (Maxwell, Pascal, Volta) w zainstalowanym systemie: zamknięty moduł G06. Bez podpisu
# SUSE, więc przy włączonym Secure Boot zostaje otwarty sterownik z Mesa (nouveau/NVK).
NVIDIA_LEGACY_PACKAGES="nvidia-driver-G06-kmp-default nvidia-video-G06 nvidia-gl-G06 nvidia-compute-utils-G06"
# Pierwszy identyfikator urządzenia PCI rodziny Turing; niższe to starsze generacje.
NVIDIA_TURING_MIN_ID=0x1e00
# Usługi uśpienia sterownika: bez nich GDM nie włącza Waylanda na karcie NVIDIA.
NVIDIA_SERVICES="nvidia-suspend.service nvidia-resume.service nvidia-hibernate.service nvidia-suspend-then-hibernate.service"
