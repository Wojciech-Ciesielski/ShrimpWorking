# Shrimp Linu(x): ustawienia oficjalnego sterownika NVIDIA (bez niego nic nie robią), na nośniku
# i w zainstalowanym systemie: Wayland w GDM i GNOME, konsola przez sterownik NVIDIA,
# pamięć karty zachowana przy uśpieniu.
options nvidia-drm modeset=1 fbdev=1
options nvidia NVreg_PreserveVideoMemoryAllocations=1
